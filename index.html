function SheetTable({ sheetKey }) {
  const rows = EXCEL_DATA[sheetKey] || [];
  const headers = rows[0] || [];
  const data = rows.slice(1);
  const [search, setSearch] = useState('');
  const [sortState, setSortState] = useState({ col: -1, asc: true });
  const [page, setPage] = useState(0);
  const PAGE = 50;

  // Detect column types from first 30 rows
  const colType = useMemo(() => headers.map((h, ci) => {
    const hl = h.toLowerCase();
    if (hl.includes('date') || hl === 'timestamp' || hl.includes('_at') || hl.includes('datetime')) return 'date';
    if (hl.includes('_id') || hl.includes('_key') || hl.endsWith('id') || hl === 'campaign_id' || hl === 'account_id' || hl === 'event_id') return 'mono';
    const sample = data.slice(0, 30).map(r => r[ci]).filter(v => v !== '' && v != null);
    if (sample.length > 5 && sample.every(v => !isNaN(+v))) return 'num';
    return 'str';
  }), [headers]);

  const filtered = useMemo(() => {
    if (!search.trim()) return data;
    const q = search.toLowerCase();
    return data.filter(r => r.some(c => String(c ?? '').toLowerCase().includes(q)));
  }, [data, search]);

  const sorted = useMemo(() => {
    const { col, asc } = sortState;
    if (col < 0) return filtered;
    return [...filtered].sort((a, b) => {
      const av = a[col] ?? '', bv = b[col] ?? '';
      const an = parseFloat(av), bn = parseFloat(bv);
      const cmp = !isNaN(an) && !isNaN(bn) ? an - bn : String(av).localeCompare(String(bv));
      return asc ? cmp : -cmp;
    });
  }, [filtered, sortState]);

  const totalPages = Math.ceil(sorted.length / PAGE);
  const pageRows = sorted.slice(page * PAGE, (page + 1) * PAGE);

  function clickSort(ci) {
    setSortState(s => ({ col: ci, asc: s.col === ci ? !s.asc : true }));
    setPage(0);
  }

  function renderCell(h, val, ci) {
    const v = val ?? '';
    if (v === '') return <td key={ci} className="td-empty">—</td>;
    const t = colType[ci];
    if (t === 'date') {
      const fmtd = xlDate(v);
      return <td key={ci} className="td-date">{fmtd}</td>;
    }
    if (t === 'num') return <td key={ci} className="td-num">{v}</td>;
    if (t === 'mono') return <td key={ci} className="td-mono">{v}</td>;
    return <td key={ci}>{String(v).length > 80 ? String(v).slice(0,80)+'…' : String(v)}</td>;
  }

  // Pagination page buttons (up to 7 visible)
  const pgBtns = useMemo(() => {
    if (totalPages <= 7) return Array.from({length: totalPages}, (_, i) => i);
    const start = Math.max(0, Math.min(page - 3, totalPages - 7));
    return Array.from({length: 7}, (_, i) => start + i);
  }, [page, totalPages]);

  return (
    <div>
      <div className="de-tbl-hdr">
        <div className="de-meta-chips">
          <span className="de-meta-chip">{data.length.toLocaleString()} rows</span>
          <span className="de-meta-chip">{headers.length} cols</span>
          {search.trim() && <span className="de-meta-chip">{filtered.length} matched</span>}
        </div>
        <div className="de-search-wrap">
          <input
            className="de-search"
            placeholder="Search all columns…"
            value={search}
            onChange={e => { setSearch(e.target.value); setPage(0); }}
          />
        </div>
      </div>
      <div className="de-tbl-scroll">
        <table className="de-table">
          <thead>
            <tr>
              {headers.map((h, ci) => (
                <th key={ci}
                  className={sortState.col === ci ? 'th-sort' : ''}
                  onClick={() => clickSort(ci)}>
                  {h}
                  {sortState.col === ci && <span style={{marginLeft:4,opacity:.7}}>{sortState.asc ? '↑' : '↓'}</span>}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {pageRows.length === 0
              ? <tr><td colSpan={headers.length || 1} className="de-empty">No matching rows</td></tr>
              : pageRows.map((row, ri) => (
                  <tr key={ri}>
                    {headers.map((h, ci) => renderCell(h, row[ci], ci))}
                  </tr>
                ))
            }
          </tbody>
        </table>
      </div>
      {totalPages > 1 && (
        <div className="de-pg">
          <span className="de-pg-info">
            {page * PAGE + 1}–{Math.min((page + 1) * PAGE, sorted.length)} of {sorted.length.toLocaleString()} rows
          </span>
          <div className="de-pg-btns">
            <button className="de-pg-btn" disabled={page === 0} onClick={() => setPage(0)}>«</button>
            <button className="de-pg-btn" disabled={page === 0} onClick={() => setPage(p => p - 1)}>‹</button>
            {pgBtns.map(p => (
              <button key={p} className={`de-pg-btn${page === p ? ' pg-on' : ''}`} onClick={() => setPage(p)}>{p + 1}</button>
            ))}
            <button className="de-pg-btn" disabled={page >= totalPages - 1} onClick={() => setPage(p => p + 1)}>›</button>
            <button className="de-pg-btn" disabled={page >= totalPages - 1} onClick={() => setPage(totalPages - 1)}>»</button>
          </div>
        </div>
      )}
    </div>
  );
}

function DataExplorer() {
  const CATS = [
    { key: 'mkt', label: 'Marketing' },
    { key: 'sls', label: 'Sales' },
  ];
  const [cat, setCat] = useState('mkt');
  const sheetKeysForCat = cat => Object.keys(SHEETS).filter(k => SHEETS[k].cat === cat);
  const [activeSheet, setActiveSheet] = useState(sheetKeysForCat('mkt')[0]);

  function switchCat(c) {
    setCat(c);
    setActiveSheet(sheetKeysForCat(c)[0]);
  }

  const cfg = SHEETS[activeSheet] || {};

  return (
    <div className="de-outer">
      <div className="de-section-hdr">
        <span className="de-section-title">Explore Raw Data</span>
        <div className="de-section-line"/>
      </div>
      <div className="de-cats">
        {CATS.map(c => (
          <button key={c.key} className={`de-cat${cat === c.key ? ' on' : ''}`} onClick={() => switchCat(c.key)}>
            {c.label}
          </button>
        ))}
      </div>
      <div className="de-sheets">
        {sheetKeysForCat(cat).map(k => (
          <button
            key={k}
            className={`de-sheet-btn${activeSheet === k ? ' on-' + cat : ''}`}
            onClick={() => setActiveSheet(k)}
          >
            {SHEETS[k].label}
          </button>
        ))}
      </div>
      {cfg.desc && <div className="de-sheet-desc">{cfg.desc}</div>}
      {activeSheet && <SheetTable key={activeSheet} sheetKey={activeSheet}/>}
    </div>
  );
}

function DataPage() {
  return (
    <div className="dp-page">
      <FractureHero/>
      <DataExplorer/>
    </div>
  );
}

/* TOPBAR — no Run Analysis button */
function TopBar({ page, setPage }) {
  const critCount=NOTIFICATIONS.filter(n=>n.prio==='Critical').length;
  useEffect(()=>{
    const bar=document.querySelector('.topbar');
    function onScroll(){bar&&bar.classList.toggle('compact',window.scrollY>48);}
    window.addEventListener('scroll',onScroll,{passive:true});
    return ()=>window.removeEventListener('scroll',onScroll);
  },[]);
  return (
    <header className="topbar">
      <button className="tb-lockup" onClick={()=>setPage('home')} aria-label="Go to home">
        <img src={ICON_HS} alt="" className="tb-icon" aria-hidden="true"/>
        <img src={LOGO_HS} alt="Growth Navigator" className="tb-logo"/>
      </button>
      <nav className="tb-nav">
        <button className={`tb-tab${page==='home'?' on':''}`} onClick={()=>setPage('home')}>Home</button>
        <button className={`tb-tab${page==='feed'?' on':''}`} onClick={()=>setPage('feed')}>
          Demo{page==='home'&&<span className="tb-badge">{critCount}</span>}
        </button>
        <button className={`tb-tab${page==='data'?' on':''}`} onClick={()=>setPage('data')}>Demo Data</button>
      </nav>
      <div className="tb-right">
        <div className="aster-tb">
          <span className="aster-tb-label">Powered by</span>
          <AsterSVG className="aster-tb-svg"/>
        </div>
      </div>
    </header>
  );
}

function App() {
  const [page, setPage] = useState('home');
  const critCount = NOTIFICATIONS.filter(n=>n.prio==='Critical').length;
  useEffect(()=>{ window.scrollTo({top:0,behavior:'instant'}); },[page]);
  return (
    <>
      <TopBar page={page} setPage={setPage}/>
      <nav className="mob-nav">
        <button className={`mn-btn${page==='home'?' on':''}`} onClick={()=>setPage('home')}>
          <span className="mn-icon">⌂</span>
          <span>Home</span>
        </button>
        <button className={`mn-btn${page==='feed'?' on':''}`} onClick={()=>setPage('feed')}>
          <span className="mn-icon">▶</span>
          <span>Demo{critCount>0&&<span className="tb-badge">{critCount}</span>}</span>
        </button>
        <button className={`mn-btn${page==='data'?' on':''}`} onClick={()=>setPage('data')}>
          <span className="mn-icon">⊞</span>
          <span>Demo Data</span>
        </button>
      </nav>
      <div className="aster-wm">
        <span className="aster-wm-label">Powered by</span>
        <AsterSVG className="aster-wm-svg"/>
      </div>
      <div className="shell">
        {page==='home'?<HomePage onGoFeed={()=>setPage('feed')}/>:page==='feed'?<FeedPage/>:<DataPage/>}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
