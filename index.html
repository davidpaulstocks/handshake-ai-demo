<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Growth Navigator — Intelligence Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
:root{
  --navy:#031433;--blue:#2563EB;--cyan:#60A5FA;--green:#60A5FA;
  --grad:linear-gradient(135deg,#60A5FA 0%,#2563EB 50%,#031433 100%);
  --grad-h:linear-gradient(135deg,#2563EB 0%,#031433 100%);
  --page:#F4F6FB;--card:#FFFFFF;--sub:#EFF3FA;
  --bdr:rgba(15,23,42,.07);--bmd:rgba(15,23,42,.13);
  --sh-sm:0 1px 3px rgba(15,23,42,.06),0 2px 10px rgba(15,23,42,.05);
  --sh-md:0 6px 28px rgba(15,23,42,.11),0 2px 8px rgba(15,23,42,.05);
  --sh-lg:0 16px 56px rgba(15,23,42,.14),0 4px 16px rgba(15,23,42,.07);
  --red:#EF4444;--red-bg:rgba(239,68,68,.07);--red-bd:rgba(239,68,68,.22);
  --org:#F97316;--org-bg:rgba(249,115,22,.07);--org-bd:rgba(249,115,22,.22);
  --t1:#0F172A;--t2:#475569;--t3:#94A3B8;
  --bar:82px;--r:18px;--ease:cubic-bezier(.16,1,.3,1);--eout:cubic-bezier(.2,.8,.2,1);
  font-family:'Inter',-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;}
body{background:var(--page);color:var(--t1);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bmd);border-radius:99px;}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.6)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes scanLine{0%{transform:translateY(-100%)}100%{transform:translateY(600%)}}
@keyframes dotPop{0%{transform:scale(1)}40%{transform:scale(1.55)}100%{transform:scale(1.3)}}
@keyframes floatA{0%,100%{transform:translateY(0) translateX(0)}40%{transform:translateY(-28px) translateX(14px)}70%{transform:translateY(16px) translateX(-10px)}}
@keyframes floatB{0%,100%{transform:translateY(0) translateX(0)}35%{transform:translateY(22px) translateX(-12px)}70%{transform:translateY(-18px) translateX(10px)}}
@keyframes floatC{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-14px) translateX(18px)}}
@keyframes coachSwipe{0%{transform:translateX(14px);opacity:0}16%{transform:translateX(0);opacity:1}70%{transform:translateX(-38px);opacity:1}88%{transform:translateX(-48px);opacity:0}100%{transform:translateX(-48px);opacity:0}}
@keyframes groupAppear{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardReveal{0%{opacity:0;transform:translateY(12px) scale(.97);filter:blur(2px)}55%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none}}
@keyframes soloReveal{0%{opacity:0;transform:translateY(16px) scale(.96);filter:blur(3px)}55%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none}}

.reveal{opacity:0;transform:translateY(26px);transition:opacity .65s var(--eout),transform .65s var(--eout);}
.reveal.visible{opacity:1;transform:none;}
.reveal.d1{transition-delay:.08s}.reveal.d2{transition-delay:.16s}.reveal.d3{transition-delay:.24s}.reveal.d4{transition-delay:.32s}

/* TOPBAR */
.topbar{position:fixed;top:0;left:0;right:0;z-index:400;height:var(--bar);background:rgba(255,255,255,.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:16px;overflow:hidden;transition:height .35s var(--ease);}
.topbar.compact{height:58px;}
/* Logo is 2048×2048 with whitespace padding — wordmark sits in vertical centre band (~46–55%).
   object-fit:cover + wide box crops to that centre band, making the wordmark fill the navbar. */
.tb-lockup{display:flex;align-items:center;gap:0;flex-shrink:0;cursor:pointer;}
.tb-icon{height:46px;width:46px;object-fit:contain;flex-shrink:0;mix-blend-mode:multiply;transition:height .35s var(--ease),width .35s var(--ease);}
.topbar.compact .tb-icon{height:38px;width:38px;}
.tb-logo{width:min(270px,24vw);height:60px;object-fit:cover;object-position:center 50%;flex-shrink:0;display:block;transition:width .35s var(--ease),height .35s var(--ease);mix-blend-mode:multiply;margin-left:-20px;}
.topbar.compact .tb-logo{width:min(200px,22vw);height:44px;margin-left:-15px;}
.tb-nav{display:flex;align-items:center;gap:2px;}
.tb-tab{padding:7px 16px;border-radius:99px;font-size:13px;font-weight:600;color:var(--t2);position:relative;transition:color .15s,background .15s;white-space:nowrap;}
.tb-tab:hover{color:var(--t1);background:rgba(15,23,42,.04);}
.tb-tab.on{color:var(--navy);font-weight:800;}
.tb-tab.on::after{content:'';position:absolute;bottom:-1px;left:16px;right:16px;height:2px;border-radius:99px;background:var(--grad);}
.tb-badge{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;background:var(--red);color:#fff;border-radius:99px;font-size:9px;font-weight:800;font-family:'IBM Plex Mono',monospace;margin-left:5px;vertical-align:middle;}
.tb-right{display:flex;align-items:center;gap:10px;}
.live-pill{display:flex;align-items:center;gap:6px;padding:5px 13px;border-radius:99px;background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.20);font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:800;color:#1e40af;letter-spacing:.1em;text-transform:uppercase;}
.live-dot{width:5px;height:5px;border-radius:50%;background:#2563EB;animation:pulse 1.8s ease-in-out infinite;}
.aster-tb{display:flex;align-items:center;gap:6px;opacity:.65;}
.aster-tb-label{font-size:9px;font-weight:500;color:var(--t3);letter-spacing:.06em;white-space:nowrap;text-transform:uppercase;}
.aster-tb-svg{width:56px;height:auto;display:block;}

/* ASTER WATERMARK */
.aster-wm{position:fixed;bottom:20px;right:24px;z-index:300;display:none;align-items:center;gap:8px;opacity:.55;pointer-events:none;background:rgba(255,255,255,.9);padding:6px 10px;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.1);}
.aster-wm-label{font-size:9px;font-weight:500;color:var(--t3);letter-spacing:.06em;white-space:nowrap;}
.aster-wm-svg{width:80px;height:auto;display:block;}

/* MOBILE BOTTOM NAV */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:500;background:rgba(255,255,255,.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--bdr);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -2px 20px rgba(15,23,42,.06);}
.mn-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:58px;color:var(--t3);font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;transition:color .15s;position:relative;padding-top:4px;}
.mn-btn.on{color:var(--navy);}
.mn-btn.on::before{content:'';position:absolute;top:0;left:18%;right:18%;height:2px;border-radius:0 0 3px 3px;background:var(--grad);}
.mn-icon{font-size:19px;line-height:1;margin-bottom:1px;}

/* MOBILE OVERRIDES */
.home-val-wrap{padding:0 32px 80px;}
@media(max-width:640px){
  /* Nav */
  .mob-nav{display:flex;}
  .tb-nav{display:none;}
  .tb-right{display:none;}
  .aster-tb{display:none;}
  /* Topbar */
  .topbar{padding:0 14px;height:60px;}
  .topbar.compact{height:52px;}
  .shell{padding-top:60px;padding-bottom:calc(58px + env(safe-area-inset-bottom,0px));}
  /* Logo */
  .tb-icon{height:36px;width:36px;}
  .tb-logo{width:50vw;height:44px;margin-left:-8px;}
  .topbar.compact .tb-icon{height:32px;width:32px;}
  .topbar.compact .tb-logo{width:44vw;height:38px;margin-left:-6px;}
  /* Toast clears bottom nav */
  .toast{bottom:calc(58px + env(safe-area-inset-bottom,0px) + 12px);}
  /* Aster watermark clears bottom nav */
  .aster-wm{display:flex;bottom:calc(58px + env(safe-area-inset-bottom,0px) + 10px);}
  /* Hero */
  .hero-wrap{padding:28px 20px 48px;}
  .hero-orb-1{width:260px;height:260px;filter:blur(40px);}
  .hero-orb-2{width:200px;height:200px;filter:blur(32px);}
  .hero-orb-3{display:none;}
  /* Stats grid */
  .sgrid{padding:0 20px;}
  /* Sections */
  .sec{padding:0 20px 40px;}
  .howcard{padding:20px;}
  /* Positioning card */
  .possec{padding:0 16px 48px;}
  .poscard{padding:28px 20px;border-radius:16px;}
  /* Testimonials */
  .home-val-wrap{padding:0 12px 40px;}
  .val-section{padding:28px 20px;}
  .val-featured{flex-direction:column;gap:12px;}
  .val-avatar{width:42px;height:42px;font-size:13px;}
  /* Feed */
  .feed-page{padding:0 14px 32px;}
  .scene-banner{padding:20px 16px;}
  .ic-wrap,.ac-wrap{min-height:260px;}
  .tg-hdr{padding:9px 12px;}
  .tg-meta{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
}

.shell{padding-top:var(--bar);min-height:100%;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:999;padding:11px 26px;border-radius:12px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.04em;white-space:nowrap;animation:fadeUp .2s var(--ease) both;box-shadow:var(--sh-lg);}
.toast.ok{background:rgba(61,222,110,.1);border:1px solid rgba(61,222,110,.3);color:#15803d;}
.toast.er{background:var(--red-bg);border:1px solid var(--red-bd);color:var(--red);}

/* HOME PAGE */
.hpage{overflow-x:hidden;}
.hero-wrap{position:relative;overflow:hidden;padding:60px 32px 80px;}
.hero-wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(circle 560px at var(--mx,50%) var(--my,44%),rgba(37,99,235,.07),transparent 70%);pointer-events:none;z-index:0;}
.hero-orb{position:absolute;border-radius:50%;pointer-events:none;filter:blur(72px);will-change:transform;z-index:0;}
.hero-orb-1{width:520px;height:520px;background:radial-gradient(circle,rgba(37,99,235,.18) 0%,transparent 70%);top:-180px;left:-140px;animation:floatA 9s ease-in-out infinite;}
.hero-orb-2{width:400px;height:400px;background:radial-gradient(circle,rgba(96,165,250,.13) 0%,transparent 70%);top:20px;right:-100px;animation:floatB 12s ease-in-out 1.5s infinite;}
.hero-orb-3{width:300px;height:300px;background:radial-gradient(circle,rgba(3,20,51,.10) 0%,transparent 70%);bottom:-40px;left:38%;animation:floatC 7s ease-in-out 3s infinite;}
.hero-inner{position:relative;z-index:1;max-width:900px;margin:0 auto;text-align:center;will-change:transform;}
.hero-video{position:absolute;left:0;top:0;width:100%;height:150%;object-fit:cover;object-position:center top;opacity:.55;mix-blend-mode:multiply;pointer-events:none;user-select:none;will-change:transform;z-index:0;display:block;}
@media(max-width:640px){.hero-video{height:100%;opacity:.45;will-change:auto;}}
@media(prefers-reduced-motion:reduce){.hero-video{display:none;}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:5px 16px;border-radius:99px;border:1px solid var(--bdr);background:rgba(255,255,255,.9);font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t2);margin-bottom:36px;box-shadow:var(--sh-sm);backdrop-filter:blur(8px);}
.edot{width:6px;height:6px;border-radius:50%;background:var(--grad);animation:pulse 2s ease-in-out infinite;}
.htitle{font-size:clamp(2.4rem,6vw,4rem);font-weight:900;line-height:1.05;letter-spacing:-.04em;color:var(--navy);margin:0 auto 24px;max-width:640px;}
.grad{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hsub{font-size:clamp(.95rem,2vw,1.12rem);color:var(--t2);line-height:1.95;max-width:620px;margin:0 auto 22px;font-weight:400;}
.probbox{max-width:580px;margin:0 auto 40px;padding:0 0 0 22px;border-left:3px solid transparent;border-image:var(--grad) 1;position:relative;}
.probbox-label{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--t3);display:block;margin-bottom:9px;}
.probbox-text{font-size:15px;font-weight:500;color:var(--t2);line-height:1.85;font-style:normal;}
.ctabtn{display:inline-flex;align-items:center;gap:10px;padding:15px 38px;border-radius:14px;background:var(--navy);color:#fff;font-size:14px;font-weight:800;letter-spacing:.01em;box-shadow:0 4px 22px rgba(3,20,51,.32);transition:all .22s var(--ease);position:relative;overflow:hidden;}
.ctabtn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.08),transparent);pointer-events:none;}
.ctabtn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(3,20,51,.44);}
.ctabtn span{display:inline-block;transition:transform .22s var(--ease);}
.ctabtn:hover span{transform:translateX(5px);}
.below-hero{background:#fff;border-radius:28px 28px 0 0;margin-top:-28px;position:relative;z-index:2;padding-top:52px;box-shadow:0 -2px 0 0 rgba(15,23,42,.04);}
.grad-strip{height:2px;background:var(--grad);max-width:860px;margin:28px auto 44px;border-radius:99px;}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:960px;margin:0 auto 52px;padding:0 32px;}
@media(max-width:640px){.sgrid{grid-template-columns:repeat(2,1fr);}}
.scell{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--sh-sm);padding:26px 18px;text-align:center;transform-style:preserve-3d;will-change:transform;}
.snum{font-size:clamp(2.4rem,5vw,3.8rem);font-weight:900;letter-spacing:-.04em;line-height:1;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px;}
.slbl{font-size:11px;color:var(--t2);line-height:1.6;}
.sec{max-width:960px;margin:0 auto;padding:0 32px 52px;}
.sectitle{font-size:24px;font-weight:900;color:var(--navy);letter-spacing:-.03em;margin-bottom:5px;}
.secsub{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--t3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:22px;}
.howgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:640px){.howgrid{grid-template-columns:1fr;}}
.howcard{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--sh-sm);padding:28px;transform-style:preserve-3d;will-change:transform;}
.hownum{display:inline-flex;align-items:center;justify-content:center;padding:5px 11px;border-radius:8px;background:var(--navy);font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:800;color:#fff;letter-spacing:.1em;margin-bottom:14px;}
.howtitle{font-size:15px;font-weight:800;color:var(--navy);margin-bottom:9px;letter-spacing:-.01em;}
.howdesc{font-size:12px;color:var(--t2);line-height:1.9;}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(max-width:480px){.pgrid{grid-template-columns:1fr;}}
.pcard{background:var(--card);border:1px solid var(--bdr);border-radius:14px;box-shadow:var(--sh-sm);padding:20px;transform-style:preserve-3d;will-change:transform;}
.prole{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:7px;}
.pjob{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:7px;}
.ppain{font-size:11px;color:var(--t3);margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid var(--bdr);}
.ppain-lbl,.pval-lbl{font-weight:600;color:var(--t2);}
.pval{font-size:12px;color:var(--t1);line-height:1.65;}
.pval-lbl{font-weight:700;color:var(--navy);}
.possec{max-width:960px;margin:0 auto;padding:0 32px 96px;}
.poscard{background:var(--navy);border-radius:24px;padding:56px;text-align:center;box-shadow:var(--sh-lg);position:relative;overflow:hidden;}
.poscard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad);}
.poscard::after{content:'';position:absolute;inset:0;background:radial-gradient(circle 500px at 70% 30%,rgba(37,99,235,.06),transparent 60%);pointer-events:none;}
.posquote{font-size:clamp(1.3rem,3.5vw,2.2rem);font-weight:300;color:#fff;margin-bottom:18px;line-height:1.4;letter-spacing:-.02em;}
.possub{font-size:14px;color:rgba(255,255,255,.5);line-height:2;max-width:580px;margin:0 auto 36px;}
.pos-cta{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;border-radius:12px;background:var(--grad-h);color:#fff;font-size:13px;font-weight:700;box-shadow:0 4px 16px rgba(23,23,232,.5);transition:all .2s var(--ease);}
.pos-cta:hover{filter:brightness(1.08);transform:translateY(-1px);}

/* FEED PAGE */
.feed-page{max-width:1320px;margin:0 auto;padding:0 24px 120px;}
.feed-hdr{padding:36px 0 22px;}
.feed-hdr-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
.feed-h{font-size:28px;font-weight:900;color:var(--navy);letter-spacing:-.035em;margin-bottom:5px;}
.feed-sub{font-size:13px;color:var(--t2);}
.feed-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.mpill{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:99px;border:1px solid var(--bdr);background:var(--card);font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;color:var(--t2);}
.mpill.cr{color:var(--red);background:var(--red-bg);border-color:var(--red-bd);}
.mpill.fl{color:var(--org);background:var(--org-bg);border-color:var(--org-bd);}
.cr-dot{width:5px;height:5px;border-radius:50%;background:var(--red);animation:pulse 1.8s ease-in-out infinite;}
.proc-banner{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:rgba(23,23,232,.05);border:1px solid rgba(23,23,232,.13);font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;color:var(--blue);letter-spacing:.06em;animation:fadeUp .2s var(--ease) both;margin-bottom:16px;}
.proc-spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(23,23,232,.2);border-top-color:var(--blue);animation:spin .6s linear infinite;flex-shrink:0;}
.filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.filter-bar{display:flex;align-items:center;gap:3px;background:var(--card);border:1px solid var(--bdr);border-radius:99px;padding:3px;overflow-x:auto;}
.fchip{padding:6px 15px;border-radius:99px;font-size:12px;font-weight:600;color:var(--t2);white-space:nowrap;transition:all .14s;}
.fchip:hover{color:var(--t1);background:rgba(15,23,42,.04);}
.fchip.on{background:var(--navy);color:#fff;box-shadow:0 1px 4px rgba(3,20,51,.22);}
.sort-s{padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--bdr);color:var(--t2);font-family:'IBM Plex Mono',monospace;font-size:10px;cursor:pointer;outline:none;margin-left:auto;}
.feed-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
@media(max-width:900px){.feed-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.feed-grid{grid-template-columns:1fr;}}
.grid-div{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:8px 0 2px;}
.grid-div-line{flex:1;height:1px;background:var(--bdr);}
.grid-div-label{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);white-space:nowrap;}
.feed-init{grid-column:1/-1;text-align:center;padding:88px 20px;display:flex;flex-direction:column;align-items:center;gap:18px;}
.feed-init-icon{width:68px;height:68px;border-radius:18px;background:rgba(23,23,232,.06);border:1px solid rgba(23,23,232,.16);position:relative;overflow:hidden;}
.feed-init-icon::after{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--blue),transparent);animation:scanLine 1.5s ease-in-out infinite;}
.feed-init-txt{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;}

/* TRIO GROUP */
.trio-group{grid-column:1/-1;background:var(--card);border:1px solid rgba(23,23,232,.11);border-radius:22px;overflow:hidden;box-shadow:0 8px 40px rgba(15,23,42,.09),0 1px 4px rgba(15,23,42,.04);animation:groupAppear .5s var(--ease) both;}
.tg-strip{height:3px;background:linear-gradient(90deg,#60A5FA,#2563EB 50%,#031433);}
.tg-hdr{display:flex;align-items:center;gap:10px;padding:12px 20px 11px;background:var(--sub);border-bottom:1px solid var(--bdr);flex-wrap:wrap;}
.tg-badge{padding:3px 10px;border-radius:99px;font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;flex-shrink:0;}
.tg-badge.pr-critical{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd);}
.tg-badge.pr-high{background:var(--org-bg);color:var(--org);border:1px solid var(--org-bd);}
.tg-badge.pr-medium{background:rgba(59,130,246,.07);color:#1d4ed8;border:1px solid rgba(59,130,246,.22);}
.tg-meta{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--t3);}
.tg-meta b{color:var(--t2);font-weight:600;}
.tg-flag{font-size:9px;color:var(--org);font-family:'IBM Plex Mono',monospace;font-weight:700;}
.tg-progress{margin-left:auto;display:flex;align-items:center;gap:5px;}
.tg-pdot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--bdr);background:var(--sub);flex-shrink:0;transition:background .35s var(--ease),border-color .35s var(--ease),box-shadow .35s var(--ease);}
.tg-pdot.on{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 2.5px rgba(23,23,232,.14);}
.tg-pline{width:18px;height:1.5px;background:var(--bdr);border-radius:99px;position:relative;overflow:hidden;flex-shrink:0;}
.tg-pline::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--blue),var(--cyan));transform-origin:left;transform:scaleX(0);transition:transform .45s var(--ease);}
.tg-pline.on::after{transform:scaleX(1);}
.tg-cards{display:flex;gap:0;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative;}
.tg-cards::-webkit-scrollbar{display:none;}
.tg-conn{flex-shrink:0;width:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:20px 0;}
.tg-cline{width:1.5px;flex:1;max-height:90px;background:var(--bdr);border-radius:99px;position:relative;overflow:hidden;}
.tg-cline::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--blue),var(--cyan));transform-origin:top;transform:scaleY(0);transition:transform .45s var(--ease);}
.tg-conn.on .tg-cline::after{transform:scaleY(1);}
.tg-cnode{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--bdr);background:var(--card);flex-shrink:0;transition:background .35s var(--ease),border-color .35s var(--ease);}
.tg-conn.on .tg-cnode{background:var(--blue);border-color:var(--blue);}
.tg-card{flex:1;min-width:260px;animation:cardReveal .45s var(--ease) both;scroll-snap-align:start;}
@media(min-width:800px){.tg-card{min-width:0;}}
.tg-dots{display:none;justify-content:center;gap:7px;padding:10px 0 14px;}
@media(max-width:799px){.tg-dots{display:flex;}}
.tg-dot{width:7px;height:7px;border-radius:50%;background:var(--bmd);border:none;cursor:pointer;transition:all .25s;}
.tg-dot.on{background:var(--navy);transform:scale(1.3);}
.coachmark{position:absolute;top:0;bottom:0;right:0;width:130px;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.85) 100%);display:flex;align-items:center;justify-content:flex-end;padding-right:18px;pointer-events:all;z-index:30;}
.coachmark-body{display:flex;flex-direction:column;align-items:center;gap:6px;animation:coachSwipe 2s ease-in-out 1.5s 3 both;}
.cm-hand{width:38px;height:58px;filter:drop-shadow(0 4px 14px rgba(3,20,51,.22));}
.cm-trail{width:40px;height:10px;}
.cm-label{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);opacity:.5;}
@media(min-width:800px){.coachmark{display:none;}}

/* INSIGHT CARD — backwards-looking, data/research focused */
.ic-wrap{background:var(--card);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--bdr);min-height:360px;animation:soloReveal .5s var(--ease) both;will-change:transform;}
.tg-card .ic-wrap{animation:none;}
/* Priority colour schemes */
.ic-wrap.pr-critical .ic-media{background:linear-gradient(148deg,#1a0506 0%,#7f1d1d 50%,#b91c1c 100%);}
.ic-wrap.pr-high     .ic-media{background:linear-gradient(148deg,#1c0a02 0%,#7c2d12 50%,#c2410c 100%);}
.ic-wrap.pr-medium   .ic-media{background:linear-gradient(148deg,#050a1a 0%,#1e3a8a 50%,#2563eb 100%);}
.ic-media{height:164px;position:relative;flex-shrink:0;overflow:hidden;padding:14px 18px 12px;display:flex;flex-direction:column;justify-content:space-between;}
/* Subtle data-grid overlay */
.ic-grid{position:absolute;inset:0;z-index:0;opacity:.07;background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);background-size:18px 18px;}
/* Chips row */
.ic-chips{position:relative;z-index:2;display:flex;align-items:flex-start;gap:5px;flex-wrap:wrap;}
.ic-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px);}
.ic-chip-dot{width:4px;height:4px;border-radius:50%;background:#fff;animation:pulse 1.8s ease-in-out infinite;}
/* Metric area — the key signal at a glance */
.ic-metric-area{position:relative;z-index:2;flex:1;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
.ic-metric-txt{display:flex;flex-direction:column;gap:3px;}
.ic-kpi-label{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55);}
.ic-kpi-change{font-size:19px;font-weight:900;color:#fff;letter-spacing:-.02em;line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,.18);}
/* Urgency strip */
.ic-urg{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.95);background:rgba(0,0,0,.22);padding:4px 10px;border-radius:6px;align-self:flex-end;flex-shrink:0;animation:shimmer 2.2s ease-in-out infinite;}
/* Card body */
.ic-body{padding:18px 20px 20px;flex:1;display:flex;flex-direction:column;gap:0;}
.ic-title{font-size:15px;font-weight:800;color:var(--navy);line-height:1.3;letter-spacing:-.02em;margin-bottom:8px;}
.ic-source-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.ic-source{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:6px;background:var(--sub);color:var(--t2);border:1px solid var(--bdr);}
.ic-date{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--t3);}
.ic-sep{height:1px;background:var(--bdr);margin-bottom:14px;}
.ic-evidence-lbl{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-bottom:7px;}
.ic-signal{font-size:13px;color:var(--t2);line-height:1.8;}

/* ACTION CARD — forward-looking, executable playbook */
.ac-wrap{background:var(--card);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--bdr);min-height:360px;will-change:transform;}
.tg-card .ac-wrap{animation:none;}
.ac-wrap.sales .ac-media{background:linear-gradient(148deg,#02050e 0%,#0f2460 50%,#1e3a8a 100%);}
.ac-wrap.mkt   .ac-media{background:linear-gradient(148deg,#010c0a 0%,#0f4e47 50%,#0f766e 100%);}
.ac-media{height:76px;position:relative;flex-shrink:0;padding:14px 18px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;}
.ac-media::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 25% 30%,rgba(255,255,255,.18) 0%,transparent 60%);pointer-events:none;}
.ac-type-label{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:800;letter-spacing:.10em;text-transform:uppercase;color:rgba(255,255,255,.9);position:relative;z-index:1;line-height:1;}
.ic-type-label{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:800;letter-spacing:.10em;text-transform:uppercase;color:rgba(255,255,255,.85);position:relative;z-index:2;line-height:1;}
.ac-role{font-size:13px;font-weight:800;color:#fff;line-height:1.2;max-width:75%;position:relative;z-index:1;}
.ac-media-lines{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;gap:4px;align-items:center;z-index:0;}
.ac-line{width:1.5px;background:rgba(255,255,255,.2);border-radius:99px;}
/* Body */
.ac-body{padding:18px 20px 16px;flex:1;display:flex;flex-direction:column;}
.ac-title{font-size:14px;font-weight:800;color:var(--navy);line-height:1.25;letter-spacing:-.02em;margin-bottom:12px;}
.ac-sep{height:1px;background:var(--bdr);margin-bottom:12px;}
.ac-steps-lbl,.ac-section-lbl{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-bottom:9px;}
.ac-steps{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.ac-step{display:flex;align-items:flex-start;gap:9px;}
.ac-step-n{flex-shrink:0;width:19px;height:19px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:800;color:#fff;line-height:1;}
.ac-wrap.sales .ac-step-n{background:#1e3a8a;}
.ac-wrap.mkt   .ac-step-n{background:#0f766e;}
.ac-step-txt{font-size:12px;color:var(--t2);line-height:1.65;padding-top:2px;}
/* Value section */
.ac-value-row{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:rgba(61,222,110,.07);border:1px solid rgba(61,222,110,.2);margin-bottom:12px;}
.ac-value-lbl{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#15803d;flex-shrink:0;}
.ac-value-txt{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:#166534;}
/* Tech/channels section */
.ac-tech-lbl{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-bottom:7px;}
.ac-tech-chips{display:flex;flex-wrap:wrap;gap:4px;}
.ac-tech-chip{padding:3px 9px;border-radius:99px;background:var(--sub);border:1px solid var(--bdr);font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--t2);}
/* Avatar row in action card body */
.ac-who{display:flex;align-items:center;gap:11px;margin-bottom:14px;}
.ac-avatar{width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;box-shadow:0 2px 10px rgba(15,23,42,.18),0 0 0 2px #fff;}
.ac-who-name{font-size:12px;font-weight:800;color:var(--navy);line-height:1.3;letter-spacing:-.01em;}

/* SOURCE BADGES — Adobe / Salesforce */
.src-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 6px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.04em;flex-shrink:0;}
.src-badge.adobe{background:rgba(255,0,0,.07);border:1px solid rgba(255,0,0,.18);color:#cc0000;}
.src-badge.sfdc{background:rgba(0,161,224,.07);border:1px solid rgba(0,161,224,.18);color:#0076A8;}
.src-badge svg{flex-shrink:0;}
/* Source badge on action card media zone */
.ac-src{position:absolute;bottom:12px;right:14px;z-index:2;}
/* Source badge on insight card — overlaid on media zone */
.ic-src{position:absolute;bottom:12px;left:14px;z-index:2;}
/* Hero section parallax lockout */
.hero-wrap{transform-style:flat;}
.hero-inner{transform-origin:center top;}

/* ── Customer Validation ── */
.val-section{background:var(--navy);border-radius:24px;padding:60px 48px;margin:40px 0 0;position:relative;overflow:hidden;}
.val-section::before{content:'';position:absolute;inset:0;background:radial-gradient(circle 600px at 25% 60%,rgba(37,99,235,.25),transparent 70%);pointer-events:none;}
.val-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:rgba(96,165,250,.7);margin-bottom:16px;display:block;}
.val-hl{font-size:clamp(1.2rem,2.8vw,1.75rem);font-weight:800;color:#F0EDE8;line-height:1.4;max-width:680px;margin-bottom:36px;letter-spacing:-.025em;}
.val-hl em{color:#60A5FA;font-style:normal;}
.val-featured{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:28px 32px;margin-bottom:20px;display:flex;gap:24px;align-items:flex-start;}
.val-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#1e3a8a,#031433);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:800;color:#60A5FA;flex-shrink:0;border:1.5px solid rgba(96,165,250,.3);}
.val-avatar.sm{width:40px;height:40px;font-size:10px;}
.val-q{font-size:clamp(.9rem,1.8vw,1.05rem);color:rgba(240,237,232,.82);line-height:1.85;flex:1;font-weight:400;}
.val-q strong{color:#60A5FA;font-weight:600;}
.val-attrib{margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.08em;color:rgba(240,237,232,.4);text-transform:uppercase;}
.val-attrib b{color:rgba(240,237,232,.75);font-weight:800;}
.val-sm-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:560px){.val-sm-grid{grid-template-columns:1fr;}}
.val-sm{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px;}
.val-sm-top{display:flex;align-items:center;gap:12px;}
.val-sm-q{font-size:12.5px;color:rgba(240,237,232,.7);line-height:1.75;font-weight:400;}

/* ── Scene Banner (ArcLight) ── */
.scene-banner{background:var(--navy);padding:36px 48px;margin:0 -24px;position:relative;overflow:hidden;}
.scene-banner::before{content:'';position:absolute;inset:0;background:radial-gradient(circle 560px at 75% 50%,rgba(37,99,235,.20),transparent 70%);pointer-events:none;}
.scene-inner{position:relative;z-index:1;max-width:1270px;margin:0 auto;}
.scene-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:rgba(96,165,250,.65);margin-bottom:14px;}
.scene-cols{display:flex;gap:48px;align-items:flex-start;flex-wrap:wrap;}
.scene-left{flex:1.4;min-width:260px;}
.scene-title{font-size:clamp(1rem,2.2vw,1.35rem);font-weight:800;color:#F0EDE8;line-height:1.45;margin-bottom:10px;letter-spacing:-.02em;}
.scene-desc{font-size:12.5px;color:rgba(240,237,232,.55);line-height:1.85;margin-bottom:18px;}
.scene-desc em{color:rgba(240,237,232,.8);font-style:normal;font-weight:500;}
.scene-stats{display:flex;gap:0;flex-wrap:wrap;border:1px solid rgba(255,255,255,.09);border-radius:12px;overflow:hidden;}
.scene-stat{flex:1;min-width:80px;padding:14px 16px;border-right:1px solid rgba(255,255,255,.08);}
.scene-stat:last-child{border-right:none;}
@media(max-width:560px){.scene-stat{border-right:none;border-bottom:1px solid rgba(255,255,255,.08);flex-basis:50%;} .scene-stat:nth-last-child(-n+2):not(:nth-child(odd) ~ .scene-stat){border-bottom:none;}}
.scene-stat-n{font-family:'IBM Plex Mono',monospace;font-size:clamp(1rem,2.2vw,1.35rem);font-weight:800;color:#60A5FA;letter-spacing:-.03em;}
.scene-stat-l{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(240,237,232,.35);margin-top:3px;}
.scene-right{flex:1;min-width:200px;display:flex;flex-direction:column;gap:8px;}
.scene-oc{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.04);border-radius:10px;border:1px solid rgba(255,255,255,.07);}
.scene-oc-val{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:800;color:#60A5FA;min-width:52px;}
.scene-oc-lbl{font-size:12px;color:rgba(240,237,232,.55);}
.scene-scroll-hint{margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(240,237,232,.22);text-align:center;}

/* ── Date Timeline Markers ── */
.date-marker-wrap{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:24px 0 8px;animation:fadeUp .35s var(--ease) both;}
.date-marker-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--bdr) 20%,var(--bdr) 80%,transparent);}
.date-marker-chip{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--t2);white-space:nowrap;padding:5px 16px;border-radius:99px;background:var(--card);border:1px solid var(--bdr);box-shadow:var(--sh-sm);}

/* ── Sticky Calendar ── */
@keyframes calFlipOut{0%{transform:rotateX(0deg);opacity:1;filter:blur(0)}50%{opacity:.55;filter:blur(1px)}100%{transform:rotateX(90deg);opacity:0;filter:blur(3px)}}
@keyframes calFlipIn{0%{transform:rotateX(-90deg);opacity:0;filter:blur(3px)}68%{transform:rotateX(10deg);opacity:1;filter:blur(0)}84%{transform:rotateX(-5deg)}100%{transform:rotateX(0deg);opacity:1;filter:blur(0)}}
.feed-layout{display:flex;gap:24px;align-items:flex-start;}
.feed-main{flex:1;min-width:0;}
.sticky-cal{width:112px;flex-shrink:0;position:sticky;top:calc(var(--bar) + 24px);}
.sticky-cal-inner{background:var(--card);border:1px solid var(--bdr);border-radius:14px;overflow:hidden;box-shadow:var(--sh-md);text-align:center;perspective:560px;}
.sticky-cal-month{background:#c41e3a;padding:9px 4px;font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#fff;}
.sticky-cal-page{transform-origin:center 50%;will-change:transform,filter;}
.sticky-cal-page.page-flip-out{animation:calFlipOut .24s ease-in both;}
.sticky-cal-page.page-flip-in{animation:calFlipIn .56s cubic-bezier(.34,1.5,.64,1) both;}
.sticky-cal-day{font-size:3.6rem;font-weight:900;color:var(--navy);line-height:1;padding:14px 6px 2px;letter-spacing:-.04em;font-family:'Inter',sans-serif;}
.sticky-cal-dow{font-family:'IBM Plex Mono',monospace;font-size:7px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);padding:2px 6px 6px;}
.sticky-cal-year{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:500;color:var(--t3);padding:5px 6px 9px;border-top:1px solid var(--bdr);}
@media(max-width:900px){.sticky-cal{display:none;}.feed-layout{display:block;}}

/* ── Val Avatar Photo ── */
.val-avatar-photo{object-fit:cover;display:block;background:none;}

/* ── Crunch View ── */
@keyframes crunchSpin{to{transform:rotate(360deg)}}
@keyframes crunchPulse{0%,100%{opacity:.4}50%{opacity:1}}
.crunch-wrap{background:linear-gradient(160deg,#031433 0%,#081f4e 100%);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;border:1px solid rgba(37,99,235,.22);min-height:360px;padding:22px 24px 20px;position:relative;}
.crunch-wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(circle 320px at 88% 0%,rgba(37,99,235,.14),transparent 70%);pointer-events:none;}
.crunch-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:rgba(96,165,250,.5);margin-bottom:14px;position:relative;z-index:1;}
.crunch-cols{display:flex;gap:36px;align-items:flex-start;flex:1;position:relative;z-index:1;}
@media(max-width:640px){.crunch-cols{flex-direction:column;gap:16px;}}
.crunch-left{flex:1.3;min-width:0;display:flex;flex-direction:column;}
.crunch-right{flex:1;min-width:160px;display:flex;flex-direction:column;gap:18px;padding-top:2px;}
.crunch-title{font-size:13px;font-weight:700;color:#F0EDE8;margin-bottom:16px;letter-spacing:-.01em;line-height:1.4;}
.crunch-sources{display:flex;flex-direction:column;gap:9px;flex:1;}
.crunch-row{display:flex;align-items:center;gap:9px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;color:rgba(240,237,232,.26);transition:color .3s ease;}
.crunch-row.active{color:rgba(240,237,232,.85);}
.crunch-row.done{color:rgba(52,211,153,.78);}
.crunch-icon{width:16px;height:16px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;font-weight:900;transition:background .3s,color .3s;}
.crunch-row.pending .crunch-icon{background:rgba(255,255,255,.03);color:rgba(255,255,255,.14);}
.crunch-row.active  .crunch-icon{background:rgba(37,99,235,.18);color:rgba(96,165,250,.9);}
.crunch-row.done    .crunch-icon{background:rgba(52,211,153,.12);color:#34D399;}
.crunch-icon-spin{width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(96,165,250,.25);border-top-color:#60A5FA;animation:crunchSpin .55s linear infinite;display:block;}
.crunch-pts{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:500;transition:color .3s;}
.crunch-row.pending .crunch-pts{color:transparent;}
.crunch-row.active .crunch-pts,.crunch-row.done .crunch-pts{color:rgba(240,237,232,.28);}
.crunch-status{margin-top:auto;padding-top:14px;font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(96,165,250,.45);animation:crunchPulse 1.3s ease-in-out infinite;}
.crunch-counter{font-family:'IBM Plex Mono',monospace;font-size:2.4rem;font-weight:800;color:#60A5FA;letter-spacing:-.04em;line-height:1;margin-bottom:4px;}
.crunch-counter-lbl{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(240,237,232,.2);margin-bottom:20px;}
.crunch-bar{height:3px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;margin-bottom:6px;}
.crunch-bar-fill{height:100%;background:linear-gradient(90deg,#60A5FA,#2563EB);border-radius:99px;transition:width .45s cubic-bezier(.4,0,.2,1);}
.crunch-bar-pct{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:600;color:rgba(240,237,232,.2);letter-spacing:.06em;}
.crunch-total-lbl{font-family:'IBM Plex Mono',monospace;font-size:8px;color:rgba(96,165,250,.28);margin-top:5px;}

/* ── Vertical trio layout ── */
@keyframes insightIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes yieldIn{from{opacity:0;transform:translateY(-6px) scale(.94)}to{opacity:1;transform:none}}
@keyframes actionIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* Insight zone — always the same full width, so crunch→insight is seamless */
.tg-insight-zone{padding:14px 14px 0;}
.tg-insight-zone .ic-wrap{animation:insightIn .42s var(--ease) both;}
.tg-waiting{background:linear-gradient(160deg,#031433 0%,#081f4e 100%);border-radius:var(--r);min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:1px solid rgba(37,99,235,.1);}
.tg-waiting-spin{width:24px;height:24px;border-radius:50%;border:2px solid rgba(96,165,250,.11);border-top-color:rgba(96,165,250,.26);animation:spin 1.6s linear infinite;}
.tg-waiting-lbl{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(96,165,250,.18);}

/* Causal connector — makes "insight caused actions" explicit */
.tg-yield{display:flex;flex-direction:column;align-items:center;padding:0 14px;animation:yieldIn .3s var(--ease) .44s both;}
.tg-yield-line{width:2px;height:16px;background:linear-gradient(180deg,rgba(37,99,235,.1),rgba(37,99,235,.32));}
.tg-yield-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 16px;border-radius:99px;background:rgba(37,99,235,.06);border:1px solid rgba(37,99,235,.2);font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);white-space:nowrap;}
.tg-yield-line-b{width:2px;height:16px;background:linear-gradient(180deg,rgba(37,99,235,.32),rgba(37,99,235,.06));}

/* Actions grid — 2-col below the insight */
.tg-actions{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:0 14px 14px;}
@media(max-width:640px){.tg-actions{grid-template-columns:1fr;}}
.tg-actions.single{grid-template-columns:minmax(0,420px);}
.tg-action-slot{animation:actionIn .38s var(--ease) both;}
.tg-mkt{animation-delay:.62s;}
.tg-sales{animation-delay:.84s;}

/* Status pill in header */
.tg-status{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
.tg-status-wait{color:var(--t3);opacity:.4;}
.tg-status-ana{color:var(--blue);animation:crunchPulse 1.3s ease-in-out infinite;}
.tg-status-done{color:#16a34a;}

/* InsightCard full-width horizontal variant (media = sidebar, body = main) */
@media(min-width:641px){
  .ic-wrap.full-w{flex-direction:row;min-height:210px;}
  .ic-wrap.full-w .ic-media{width:35%;height:auto;min-height:210px;justify-content:flex-start;gap:14px;}
  .ic-wrap.full-w .ic-body{padding:22px 28px;justify-content:flex-start;}
}

/* ══════════════════════════════════════════════════════════════════════════
   TRAINING DATA PAGE — dark-theme, premium data explorer
   ══════════════════════════════════════════════════════════════════════════ */
.dp-page{background:var(--page);min-height:calc(100vh - var(--bar));color:var(--t1);}

/* ── Fissure Hero (tectonic plate separation) ── */
.fh{position:relative;overflow:hidden;background:var(--navy);}
.fh-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.fh-layout{position:relative;z-index:2;display:grid;grid-template-columns:1fr 52px 1fr;min-height:350px;}
.fh-side{padding:44px 48px 32px;display:flex;flex-direction:column;gap:11px;}
.fh-side.sls{align-items:flex-end;text-align:right;}
.fh-plate-label{font-size:8px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:4px;}
/* Vendor list */
.fh-vendors{display:flex;flex-direction:column;gap:4px;}
.fh-vendors.sls{align-items:flex-end;}
.fh-vendor{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:7px;font-size:11.5px;font-weight:700;border:1px solid;width:fit-content;white-space:nowrap;}
.fh-vendor.mkt{color:rgba(148,163,184,.85);border-color:rgba(37,99,235,.18);background:rgba(37,99,235,.05);}
.fh-vendor.sls{color:rgba(148,163,184,.85);border-color:rgba(56,189,248,.14);background:rgba(56,189,248,.03);}
.fh-vendor-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0;}
.fh-vendor-dot.mkt{background:rgba(96,165,250,.75);}
.fh-vendor-dot.sls{background:rgba(56,189,248,.75);}
.fh-vendor-role{font-size:8px;font-weight:500;opacity:.48;font-family:'IBM Plex Mono',monospace;letter-spacing:.02em;}
/* Dataset chips */
.fh-chips-label{font-size:7px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:rgba(240,237,232,.16);margin-top:6px;}
.fh-chips{display:flex;flex-wrap:wrap;gap:4px;max-width:400px;}
.fh-chips.sls{justify-content:flex-end;}
.fh-chip{padding:2px 8px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap;border:1px solid;}
.fh-chip.mkt{color:rgba(96,165,250,.5);border-color:rgba(37,99,235,.13);background:rgba(37,99,235,.03);}
.fh-chip.sls{color:rgba(56,189,248,.5);border-color:rgba(56,189,248,.11);background:rgba(56,189,248,.025);}
/* Void column */
.fh-void-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;}
.fh-void-label{font-family:'IBM Plex Mono',monospace;font-size:6.5px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:rgba(96,165,250,.45);writing-mode:vertical-rl;transform:rotate(180deg);position:relative;z-index:1;}
.fh-void-icon{width:20px;height:20px;border-radius:50%;background:rgba(96,165,250,.07);border:1px solid rgba(96,165,250,.22);display:flex;align-items:center;justify-content:center;font-size:9px;position:relative;z-index:1;}
/* Hero bottom */
.fh-bottom{position:relative;z-index:2;padding:18px 48px 0;text-align:center;}
.fh-eyebrow-bar{display:inline-flex;align-items:center;gap:8px;padding:4px 14px;border-radius:99px;background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.22);font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#93c5fd;margin-bottom:16px;}
.fh-eyebrow-dot{width:5px;height:5px;border-radius:50%;background:#60A5FA;animation:pulse 2s ease-in-out infinite;flex-shrink:0;}
.fh-title{font-size:clamp(1.4rem,3.2vw,2.4rem);font-weight:900;line-height:1.1;letter-spacing:-.03em;color:#fff;margin-bottom:6px;}
.fh-gold{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.fh-subtitle{font-size:.88rem;color:rgba(255,255,255,.38);margin-bottom:24px;}
/* Stats row */
.fh-stats{display:flex;align-items:stretch;border-top:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.25);flex-wrap:wrap;margin-top:28px;}
.fh-stat{display:flex;flex-direction:column;align-items:center;padding:16px 18px;border-right:1px solid rgba(255,255,255,.05);flex:1;min-width:90px;}
.fh-stat:last-child{border-right:none;}
.fh-stat-val{font-family:'IBM Plex Mono',monospace;font-size:1.35rem;font-weight:800;color:#fff;letter-spacing:-.02em;}
.fh-stat-acc{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.fh-stat-lbl{font-size:7.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-top:2px;text-align:center;}
@media(max-width:700px){
  .fh-layout{grid-template-columns:1fr;}
  .fh-void-col{display:none;}
  .fh-side.sls{align-items:flex-start;text-align:left;}
  .fh-chips.sls,.fh-vendors.sls{justify-content:flex-start;align-items:flex-start;}
}

/* ── Data Explorer ── */
.de-outer{padding:44px 40px 64px;max-width:1600px;margin:0 auto;}
.de-section-hdr{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
.de-section-title{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);white-space:nowrap;}
.de-section-line{flex:1;height:1px;background:var(--bdr);}
/* Category tabs — matches .filter-bar pattern from feed */
.de-cats{display:flex;gap:3px;margin-bottom:18px;background:var(--card);border:1px solid var(--bdr);border-radius:11px;padding:4px;width:fit-content;box-shadow:var(--sh-sm);}
.de-cat{padding:7px 20px;border-radius:8px;font-size:12px;font-weight:700;color:var(--t2);transition:all .18s var(--ease);}
.de-cat:hover{color:var(--t1);background:rgba(15,23,42,.04);}
.de-cat.on{background:var(--navy);color:#fff;box-shadow:0 1px 6px rgba(3,20,51,.28);}
/* Sheet sub-tabs */
.de-sheets{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px;}
.de-sheet-btn{padding:5px 13px;border-radius:7px;font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--t3);border:1px solid var(--bdr);background:var(--card);transition:all .16s var(--ease);}
.de-sheet-btn:hover{color:var(--t2);border-color:var(--bmd);}
.de-sheet-btn.on-mkt{background:rgba(37,99,235,.07);border-color:rgba(37,99,235,.25);color:var(--blue);font-weight:800;}
.de-sheet-btn.on-sls{background:rgba(3,20,51,.06);border-color:rgba(3,20,51,.2);color:var(--navy);font-weight:800;}
/* Sheet desc */
.de-sheet-desc{font-size:11.5px;color:var(--t2);margin-bottom:14px;padding:9px 14px;background:rgba(37,99,235,.03);border-left:2px solid rgba(37,99,235,.2);border-radius:0 6px 6px 0;line-height:1.55;}
/* Table header bar */
.de-tbl-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.de-meta-chips{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
.de-meta-chip{font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:5px;background:var(--sub);border:1px solid var(--bdr);color:var(--t3);}
.de-search-wrap{position:relative;flex:1;min-width:180px;max-width:360px;}
.de-search-wrap::before{content:'⌕';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--t3);pointer-events:none;z-index:1;}
.de-search{width:100%;padding:8px 14px 8px 30px;border-radius:8px;background:var(--card);border:1px solid var(--bdr);color:var(--t1);font-size:12px;font-family:'Inter',sans-serif;outline:none;transition:border-color .18s;box-shadow:var(--sh-sm);}
.de-search::placeholder{color:var(--t3);}
.de-search:focus{border-color:rgba(37,99,235,.4);}
/* Table */
.de-tbl-scroll{overflow-x:auto;border-radius:12px;border:1px solid var(--bdr);background:var(--card);box-shadow:var(--sh-sm);}
.de-tbl-scroll::-webkit-scrollbar{height:4px;}
.de-tbl-scroll::-webkit-scrollbar-thumb{background:var(--bmd);border-radius:99px;}
.de-table{width:100%;border-collapse:collapse;font-size:11.5px;}
.de-table thead tr{border-bottom:1px solid var(--bdr);background:var(--sub);}
.de-table th{padding:10px 14px;text-align:left;font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);white-space:nowrap;cursor:pointer;user-select:none;transition:color .13s;position:sticky;top:0;background:var(--sub);backdrop-filter:blur(8px);}
.de-table th:hover{color:var(--t2);}
.de-table th.th-sort{color:var(--blue);}
.de-table tbody tr{border-bottom:1px solid var(--bdr);transition:background .1s;}
.de-table tbody tr:last-child{border-bottom:none;}
.de-table tbody tr:hover{background:var(--sub);}
.de-table td{padding:7px 14px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px;}
.de-table td.td-mono{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--blue);}
.de-table td.td-num{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:#059669;text-align:right;}
.de-table td.td-date{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:#B45309;}
.de-table td.td-empty{color:var(--t3);font-style:italic;font-size:10px;}
/* Pagination */
.de-pg{display:flex;align-items:center;justify-content:space-between;padding:12px 2px 0;flex-wrap:wrap;gap:8px;}
.de-pg-info{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--t3);letter-spacing:.04em;}
.de-pg-btns{display:flex;gap:3px;}
.de-pg-btn{min-width:28px;height:27px;border-radius:6px;font-size:11px;font-weight:700;color:var(--t2);border:1px solid var(--bdr);background:var(--card);transition:all .13s;display:flex;align-items:center;justify-content:center;padding:0 6px;}
.de-pg-btn:hover:not(:disabled){color:var(--t1);border-color:var(--bmd);}
.de-pg-btn:disabled{opacity:.3;cursor:not-allowed;}
.de-pg-btn.pg-on{background:rgba(37,99,235,.08);border-color:rgba(37,99,235,.25);color:var(--blue);font-weight:800;}
/* Empty state */
.de-empty{padding:52px;text-align:center;color:var(--t3);font-size:11px;font-family:'IBM Plex Mono',monospace;letter-spacing:.04em;}
/* Responsive */
@media(max-width:700px){
  .fh-panels{grid-template-columns:1fr;gap:24px;padding:32px 24px 24px;}
  .fh-center-col{display:none;}
  .fh-side{padding:20px 18px 16px;}
  .fh-side.sls{align-items:flex-start;text-align:left;}
  .fh-chips.sls{justify-content:flex-start;}
  .fh-bottom{padding:14px 18px 0;}
  /* Fix dangling border-right on wrapped stat rows */
  .fh-stat{border-right:none;border-bottom:1px solid rgba(255,255,255,.05);flex-basis:50%;}
  .fh-stat:last-child{border-bottom:none;}
  .de-outer{padding:20px 16px 40px;}
  /* Full-width category tabs */
  .de-cats{width:100%;overflow-x:auto;flex-wrap:nowrap;}
  .de-cat{flex:1;text-align:center;}
  /* Disable sticky header inside overflow-x:auto (broken in mobile Safari) */
  .de-table th{position:static;}
}
@keyframes zgDraw{from{stroke-dashoffset:660}to{stroke-dashoffset:0}}
.fh-zg-line{stroke-dasharray:660;stroke-dashoffset:660;animation:zgDraw 1.6s cubic-bezier(.16,1,.3,1) .15s both;}
/* ══════════════════════════════════════════════════════════════════════════
   TRIO GROUP — Constant-shape insight reveal + ghost action skeleton system
   ══════════════════════════════════════════════════════════════════════════ */

/* Shimmer keyframe — single source of truth for all skeleton bones */
@keyframes skimmer{0%{background-position:-300% 0}100%{background-position:300% 0}}
@keyframes ghostBreathe{0%,100%{opacity:.72}50%{opacity:1}}
@keyframes ovIdlePulse{0%,100%{opacity:.45}50%{opacity:.9}}
@keyframes tgSlotIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Skeleton bone — reusable shimmer strip */
.g-bone{
  border-radius:6px;
  background:linear-gradient(90deg,var(--sub) 25%,rgba(240,243,252,.97) 50%,var(--sub) 75%);
  background-size:300% 100%;
  animation:skimmer 1.9s linear infinite;
}

/* ── Insight zone overlay ── */
.tg-ic-wrap{position:relative;}

.tg-ic-reveal{opacity:0;transition:opacity .85s cubic-bezier(.16,1,.3,1);}
.tg-ic-reveal.ic-on{opacity:1;}

.tg-ic-overlay{
  position:absolute;inset:0;z-index:10;
  border-radius:var(--r);overflow:hidden;
  display:flex;
  transition:opacity .85s cubic-bezier(.16,1,.3,1);
  pointer-events:none;
}
.tg-ic-overlay.tg-ov-out{opacity:0;pointer-events:none;}

.tg-ov-left{
  width:35%;flex-shrink:0;
  background:linear-gradient(160deg,#031433 0%,#081f4e 100%);
  position:relative;overflow:hidden;
}
/* Strip CrunchView's own card-level chrome when nested in the overlay */
.tg-ov-left .crunch-wrap{
  background:transparent;border:none;border-radius:0;
  min-height:0;height:100%;padding:14px 12px 12px;
}
.tg-ov-left .crunch-wrap::before{display:none;}

.tg-ov-idle{position:absolute;inset:0;background:radial-gradient(circle 200px at 40% 55%,rgba(37,99,235,.18),transparent 70%);animation:ovIdlePulse 2.8s ease-in-out infinite;}

.tg-ov-right{
  flex:1;
  background:var(--card);
  padding:22px 24px;
  display:flex;flex-direction:column;gap:9px;
}

/* ── Ghost action skeleton ── */
.tg-slot-contain{position:relative;}
.tg-slot-real{opacity:0;transition:opacity .65s cubic-bezier(.16,1,.3,1);}
.tg-slot-real.slot-on{opacity:1;}

.tg-ghost-veil{
  position:absolute;inset:0;z-index:5;
  border-radius:var(--r);overflow:hidden;
  transition:opacity .65s cubic-bezier(.16,1,.3,1);
  pointer-events:none;
}
.tg-ghost-veil.veil-out{opacity:0;}

.tg-ghost-card{
  border-radius:var(--r);overflow:hidden;
  background:var(--card);
  border:1px solid var(--bdr);
  animation:ghostBreathe 2.6s ease-in-out infinite;
  height:100%;
}
.ghost-hdr-band{height:76px;}
.g-mkt .ghost-hdr-band{background:linear-gradient(148deg,#02050e 0%,#0f4e47 50%,#0f766e 100%);}
.g-sales .ghost-hdr-band{background:linear-gradient(148deg,#02050e 0%,#0f2460 50%,#1e3a8a 100%);}
.ghost-body-pad{padding:18px 20px 22px;display:flex;flex-direction:column;gap:8px;}
.ghost-who-row{display:flex;align-items:center;gap:11px;margin-bottom:4px;}
.ghost-circle{width:44px;height:44px;border-radius:50%;flex-shrink:0;}
.ghost-name-stack{flex:1;display:flex;flex-direction:column;gap:7px;}
.ghost-sep{height:1px;background:var(--bdr);margin:4px 0;}
.ghost-val-bone{height:40px;border-radius:10px;margin-top:4px;}

/* Connector entrance — restated here with new name to avoid conflict */
.tg-yield-enter{animation:tgSlotIn .48s cubic-bezier(.16,1,.3,1) both;}

/* ── LATE MOBILE OVERRIDES — must come after all desktop rules to win cascade ── */
@media(max-width:640px){
  .shell{padding-top:60px;}
  .hero-wrap{padding:28px 20px 48px;}
  .below-hero{padding-top:32px;}
  .probbox{margin:0 0 28px;max-width:100%;}
  .sgrid{padding:0 20px;}

/* Deterministic sparkline per insight id */
function Sparkline({ id, color }) {
  const pts = Array.from({length:14},(_,i)=>{
    const v=Math.sin(id*2.3+i*1.1)*0.35+Math.cos(id*1.7+i*0.8)*0.25+0.52;
    return Math.max(0.08,Math.min(0.92,v));
  });
  const W=110,H=44;
  const step=W/(pts.length-1);
  const coord=(p,i)=>`${(i*step).toFixed(1)},${(H-p*H).toFixed(1)}`;
  const line=pts.map(coord).join(' ');
  const area=`0,${H} ${line} ${W},${H}`;
  const uid=`sg${id}`;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" width={W} height={H} style={{flexShrink:0,opacity:.65}}>
      <defs>
        <linearGradient id={uid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.5"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <polygon points={area} fill={`url(#${uid})`}/>
      <polyline points={line} fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx={(pts.length-1)*step} cy={H-pts[pts.length-1]*H} r="2.5" fill={color}/>
    </svg>
  );
}

function CrunchView({sourceKey}){
  const ds=SRC_DATASETS[sourceKey]||SRC_DATASETS['Mkt-Campaigns'];
  const total=ds.reduce((s,[,n])=>s+n,0);
  const [activeIdx,setActiveIdx]=useState(-1);
  const [doneCount,setDoneCount]=useState(0);
  const [count,setCount]=useState(0);
  const [synth,setSynth]=useState(false);
  useEffect(()=>{
    const ts=[];
    ds.forEach((_,i)=>{
      ts.push(setTimeout(()=>setActiveIdx(i),220+i*430));
      ts.push(setTimeout(()=>setDoneCount(i+1),540+i*430));
    });
    ts.push(setTimeout(()=>setSynth(true),220+ds.length*430+200));
    return ()=>ts.forEach(clearTimeout);
  },[]);
  useEffect(()=>{
    let raf;const dur=1950;const st=performance.now();
    function tick(now){const p=Math.min((now-st)/dur,1);const ep=1-Math.pow(1-p,2.6);setCount(Math.round(ep*total));if(p<1)raf=requestAnimationFrame(tick);}
    raf=requestAnimationFrame(tick);
    return ()=>cancelAnimationFrame(raf);
  },[total]);
  const pct=Math.round(doneCount/ds.length*100);
  return (
    <div className="crunch-wrap">
      <div className="crunch-eyebrow">Growth Navigator · Analysing</div>
      <div className="crunch-cols">
        <div className="crunch-left">
          <div className="crunch-title">Cross-referencing {ds.length} data source{ds.length>1?'s':''}</div>
          <div className="crunch-sources">
            {ds.map(([name,pts],i)=>{
              const st=i<doneCount?'done':i===activeIdx?'active':'pending';
              return (
                <div key={name} className={`crunch-row ${st}`}>
                  <div className="crunch-icon">{st==='done'?'✓':st==='active'?<span className="crunch-icon-spin"/>:'○'}</div>
                  <span>{name}</span>
                  <span className="crunch-pts">{pts.toLocaleString()} pts</span>
                </div>
              );
            })}
          </div>
          {synth&&<div className="crunch-status">Synthesising insight…</div>}
        </div>
        <div className="crunch-right">
          <div>
            <div className="crunch-counter">{count.toLocaleString()}</div>
            <div className="crunch-counter-lbl">data points analysed</div>
          </div>
          <div>
            <div className="crunch-bar"><div className="crunch-bar-fill" style={{width:`${pct}%`}}/></div>
            <div className="crunch-bar-pct">{pct}% complete</div>
            <div className="crunch-total-lbl">{ds.length} sources · 41,804 pts total</div>
          </div>
        </div>
      </div>
    </div>
  );
}

function xlDate(v){
  if(!v||isNaN(+v)||+v<40000||+v>50000)return v;
  const d=new Date(Math.round((+v-25569)*86400000));
  return d.toISOString().slice(0,16).replace('T',' ');
}


function parseRoleForTag(roles, tag) {
  const parts = roles.split(';').map(r=>r.trim());
  const salesKw = ['SDR','BDR','AE','Account Executive','Sales Engineer',' SE','CRO','Sales Leader','Sales Director','RevOps'];
  const mktKw = ['Demand Gen','Paid Media','Marketing','Social Media','Creative','ABM','Product Marketing'];
  if (tag === 'Sales') return parts.find(r=>salesKw.some(k=>r.includes(k))) || parts[0];
  return parts.find(r=>mktKw.some(k=>r.includes(k))) || parts[parts.length-1];
}
function synthesizeNotif(insight, tag) {
  const action = tag === 'Sales'
    ? `Review the ${insight.kpiLabel} signal and identify priority accounts; Reach out within 24-48h referencing the specific data point; Log activity and next steps in CRM`
    : `Analyse the ${insight.kpiLabel} movement in ${insight.source}; Adjust campaigns or content strategy based on the signal; Share update with Sales and align on follow-up`;
  return { insightId:insight.id, tag, prio:insight.prio, title:insight.title,
    role:parseRoleForTag(insight.roles,tag), signal:insight.signal,
    action, value:insight.value };
}

function TrioGroup({ unit }) {
  const [phase, setPhase] = useState(0);
  const wrapRef = useRef(null);

  useEffect(()=>{
    const obs=new IntersectionObserver(entries=>{
      entries.forEach(e=>{if(e.isIntersecting){setPhase(1);obs.disconnect();}});
    },{threshold:0.06});
    if(wrapRef.current) obs.observe(wrapRef.current);
    return ()=>obs.disconnect();
  },[]);

  useEffect(()=>{
    if(phase===1){const t=setTimeout(()=>setPhase(2),2200);return()=>clearTimeout(t);}
    if(phase===2){const t=setTimeout(()=>setPhase(3),520);return()=>clearTimeout(t);}
    if(phase===3){const t=setTimeout(()=>setPhase(4),620);return()=>clearTimeout(t);}
  },[phase]);

  const { insight, mktNotif, salesNotif } = unit;
  const pc = insight.prio.toLowerCase();
  const actionCount = (mktNotif?1:0) + (salesNotif?1:0);

  return (
    <div className="trio-group" ref={wrapRef}>
      <div className="tg-strip"/>

      {/* Header */}
      <div className="tg-hdr">
        <span className={`tg-badge pr-${pc}`}>{insight.prio}</span>
        <span className="tg-meta"><b>{insight.source}</b> · {fmtDate(insight.date)}</span>
        {insight.hl && <span className="tg-flag">⚑ Flagged</span>}
        <div className="tg-status">
          {phase===0 && <span className="tg-status-wait">—</span>}
          {phase===1 && <span className="tg-status-ana">Analysing…</span>}
          {phase>=2 && <span className="tg-status-done">✓ {actionCount} action{actionCount!==1?'s':''} ready</span>}
        </div>
      </div>

      {/* Zone 1 — constant container: overlay covers real card, then cross-fades away */}
      <div className="tg-insight-zone">
        <div className="tg-ic-wrap">
          {/* Real card always present — drives container height, never shape-shifts */}
          <div className={`tg-ic-reveal${phase>=2?' ic-on':''}`}>
            <InsightCard insight={insight} fullWidth/>
          </div>
          {/* Processing overlay — sits absolute on top, fades out when insight is ready */}
          <div className={`tg-ic-overlay${phase>=2?' tg-ov-out':''}`}>
            <div className="tg-ov-left">
              {phase===1
                ? <CrunchView sourceKey={insight.source}/>
                : <div className="tg-ov-idle"/>}
            </div>
            <div className="tg-ov-right">
              <div className="g-bone" style={{height:'19px',width:'66%',borderRadius:'7px',animationDelay:'0s'}}/>
              <div style={{display:'flex',gap:'8px',marginBottom:'2px'}}>
                <div className="g-bone" style={{height:'24px',width:'90px',borderRadius:'6px',animationDelay:'.1s'}}/>
                <div className="g-bone" style={{height:'24px',width:'110px',borderRadius:'6px',animationDelay:'.16s'}}/>
              </div>
              <div style={{height:'1px',background:'var(--bdr)',margin:'4px 0 8px'}}/>
              <div className="g-bone" style={{height:'9px',width:'68px',borderRadius:'4px',animationDelay:'.08s',marginBottom:'14px'}}/>
              <div className="g-bone" style={{height:'13px',width:'96%',borderRadius:'5px',animationDelay:'0s'}}/>
              <div className="g-bone" style={{height:'13px',width:'82%',borderRadius:'5px',animationDelay:'.13s'}}/>
              <div className="g-bone" style={{height:'13px',width:'61%',borderRadius:'5px',animationDelay:'.26s'}}/>
            </div>
          </div>
        </div>
      </div>

      {/* Zone 2 — causal connector: appears when insight is revealed */}
      {phase>=2 && actionCount>0 && (
        <div className="tg-yield">
          <div className="tg-yield-line"/>
          <div className="tg-yield-badge">
            <span>⚡</span>
            <span>Growth Navigator synthesised {actionCount} action{actionCount!==1?'s':''}</span>
          </div>
          <div className="tg-yield-line-b"/>
        </div>
      )}

      {/* Zone 3 — ghost slots from phase 1, real cards stagger in at phase 3 / 4 */}
      {phase>=1 && actionCount>0 && (
        <div className={`tg-actions${actionCount===1?' single':''}`}>
          {mktNotif && (
            <div className="tg-action-slot tg-mkt tg-slot-contain">
              <div className={`tg-slot-real${phase>=3?' slot-on':''}`}>
                <ActionCard notif={mktNotif} type="mkt" tech={insight.tech}/>
              </div>
              <div className={`tg-ghost-veil${phase>=3?' veil-out':''}`}>
                <GhostSlot type="mkt"/>
              </div>
            </div>
          )}
          {salesNotif && (
            <div className="tg-action-slot tg-sales tg-slot-contain">
              <div className={`tg-slot-real${phase>=4?' slot-on':''}`}>
                <ActionCard notif={salesNotif} type="sales" tech={insight.tech}/>
              </div>
              <div className={`tg-ghost-veil${phase>=4?' veil-out':''}`}>
                <GhostSlot type="sales"/>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function StickyCal({currentDate}){
  const [displayDate, setDisplayDate] = useState(null);
  const [flipState, setFlipState] = useState(null); // null | 'out' | 'in'
  const flipRef = useRef(null);

  useEffect(()=>{
    if(!currentDate) return;
    if(!displayDate){setDisplayDate(currentDate);return;}
    if(currentDate===displayDate) return;
    setFlipState('out');
    flipRef.current=setTimeout(()=>{
      setDisplayDate(currentDate);
      setFlipState('in');
      flipRef.current=setTimeout(()=>setFlipState(null),560);
    },240);
    return ()=>clearTimeout(flipRef.current);
  },[currentDate]);

  if(!displayDate)return <div className="sticky-cal" style={{visibility:'hidden'}}/>;
  const{dow,day,month,year}=parseDateParts(displayDate);
  const pageClass=`sticky-cal-page${flipState?' page-flip-'+flipState:''}`;
  return (
    <div className="sticky-cal">
      <div className="sticky-cal-inner">
        <div className="sticky-cal-month">{month}</div>
        <div className={pageClass}>
          <div className="sticky-cal-day">{day}</div>
          <div className="sticky-cal-dow">{dow}</div>
          <div className="sticky-cal-year">{year}</div>
        </div>
      </div>
    </div>
  );
}

  const [filter, setFilter] = useState('all');
  const [sort,   setSort]   = useState('time');
  const [currentDate, setCurrentDate] = useState(null);
  const prevDateRef = useRef(null);

  // All trios rendered at once; each card self-triggers on scroll
  const allLoaded = useMemo(()=>buildQueue(),[]);

  useEffect(()=>{
    function trackDate(){
      const markers=document.querySelectorAll('.date-marker-wrap[data-date]');
      if(!markers.length)return;
      const cutoff=window.scrollY+82+60;
      let found=null;
      markers.forEach(el=>{if(el.getBoundingClientRect().top+window.scrollY<=cutoff)found=el.dataset.date;});
      if(found&&found!==prevDateRef.current){prevDateRef.current=found;setCurrentDate(found);}
    }
    window.addEventListener('scroll',trackDate,{passive:true});
    return ()=>window.removeEventListener('scroll',trackDate);
  },[]);

  const visible = useMemo(()=>{
    let units=allLoaded;
    if(filter!=='all'){
      units=units.filter(u=>{
        const ins=u.insight;
        if(filter==='Sales'||filter==='Marketing')return ins.tag===filter;
        return true;
      });
    }
    if(sort==='priority'){
      units=[...units].sort((a,b)=>P_ORD[a.insight.prio]-P_ORD[b.insight.prio]);
      return units;
    }
    // Inject date markers for chronological view
    const result=[];
    let lastDate=null;
    for(const unit of units){
      const d=unit.insight.date;
      if(d!==lastDate){result.push({type:'date-marker',date:d});lastDate=d;}
      result.push(unit);
    }
    return result;
  },[allLoaded,filter,sort]);

  const critCount=allLoaded.filter(u=>u.insight.prio==='Critical').length;
  const flagCount=allLoaded.filter(u=>u.insight.hl).length;

  return (
    <div className="feed-page">
      <SceneBanner/>
      <div className="feed-hdr">
        <div className="feed-hdr-top">
          <div>
            <h1 className="feed-h">Intelligence Feed</h1>
            <p className="feed-sub">{INSIGHTS.length} signals across 30 days · scroll to analyse each insight</p>
          </div>
          <div className="feed-meta">
            <div className="live-pill"><span className="live-dot"/>LIVE</div>
            {critCount>0&&<span className="mpill cr"><span className="cr-dot"/>{critCount} critical</span>}
            {flagCount>0&&<span className="mpill fl">⚑ {flagCount} flagged</span>}
          </div>
        </div>
        <div className="filters">
          <div className="filter-bar">
            {FILTER_OPTS.map(f=><button key={f.k} className={`fchip${filter===f.k?' on':''}`} onClick={()=>setFilter(f.k)}>{f.l}</button>)}
          </div>
          <select className="sort-s" value={sort} onChange={e=>setSort(e.target.value)}>
            <option value="time">As detected</option>
            <option value="priority">Priority</option>
          </select>
        </div>
      </div>
      <div className="feed-layout">
        <StickyCal currentDate={currentDate}/>
        <div className="feed-main">
          <div className="feed-grid">
            {visible.map(unit=>{
              if(unit.type==='date-marker')return <DateMarker key={`date-${unit.date}`} date={unit.date}/>;
              return <TrioGroup key={`trio-${unit.insight.id}`} unit={unit}/>;
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

function StatCell({stat,delay,started,revClass}){
  const [val,setVal]=useState(0);
  useEffect(()=>{
    if(!started)return;
    let raf;
    const t=setTimeout(()=>{
      const dur=1400;const st=performance.now();
      function tick(now){const p=Math.min((now-st)/dur,1);const ep=1-Math.pow(1-p,3);setVal(Math.round(ep*stat.raw));if(p<1)raf=requestAnimationFrame(tick);}
      raf=requestAnimationFrame(tick);
    },delay);
    return ()=>{clearTimeout(t);cancelAnimationFrame(raf);};
  },[started]);
  const display=(started&&val<stat.raw)?stat.fmt(val):stat.display;
  return (
    <div className={`scell ${revClass}`} {...tilt}>
      <div className="snum">{display}</div>
      <div className="slbl">{stat.label}</div>
    </div>
  );
}

function HomePage({ onGoFeed }) {

    const sobs=new IntersectionObserver(entries=>{
      entries.forEach(e=>{if(e.isIntersecting){setStatsStarted(true);sobs.disconnect();}});
    },{threshold:0.25});
    if(statsRef.current) sobs.observe(statsRef.current);
    return ()=>sobs.disconnect();
  },[]);

  /* Mobile seek unlock — play+pause immediately so currentTime can be set on iOS */
  useEffect(()=>{
    const vid=videoRef.current;
    if(!vid) return;
    const unlock=()=>{vid.play().then(()=>{vid.pause();vid.currentTime=0;}).catch(()=>{});};
    if(vid.readyState>=1) unlock(); else vid.addEventListener('loadedmetadata',unlock,{once:true});
  },[]);

  useEffect(()=>{
    function onScroll(){
      const y=window.scrollY;
      /* Orbs drift slowly — decorative parallax only, no content clipping */
      const o1=document.querySelector('.hero-orb-1');
      if(o1)o1.style.transform=`translateY(${-y*.12}px)`;
      const o2=document.querySelector('.hero-orb-2');

      const vid=videoRef.current;

        }
        /* Desktop only: translateY parallax (video is 150% tall, slide upward) */
        if(window.innerWidth>640){
